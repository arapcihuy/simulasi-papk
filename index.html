<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"><meta http-equiv="pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3e2f">
<title>Simulasi Belajar — Psikotes PAPK TNI</title>
<style>
:root{--olive:#2f3e2f;--purple:#7b1fa2;--lav:#f7e9f7;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--ok:#1c7c46;--bad:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff}
.shell{display:grid;grid-template-columns:340px 1fr;min-height:100dvh}
.left{background:linear-gradient(165deg,#4a5f45,#3a4a36 38%,#243024);color:#fff;padding:28px 26px;display:flex;flex-direction:column;gap:8px}
.emblem{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.emblem svg{width:44px;height:44px}.left h1{font-size:24px;line-height:1.28;font-weight:800;margin:18px 0 0}
.rule{width:54px;height:4px;border-radius:99px;background:#a06bd8;margin:12px 0}.left p{color:#d3dcd1;font-size:13.5px;margin:0 0 8px}
.left .foot{margin-top:auto;color:#9aa79a;font-size:11px}
.right{background:linear-gradient(150deg,#f7e9f7,#f3eef9 60%,#f5f1fa);padding:30px 24px;display:grid;place-items:center}
.card{width:100%;max-width:640px;background:#fff;border-radius:18px;box-shadow:0 18px 46px rgba(64,32,88,.16);overflow:hidden}
.card::before{content:"";display:block;height:5px;background:linear-gradient(90deg,#a06bd8,#2f3e2f)}
.cbody{padding:24px 26px 28px}h2{font-size:20px;font-weight:800;margin:0 0 6px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
fieldset{border:1px solid #ece2f3;background:#fbf7fd;border-radius:14px;padding:16px;margin:0 0 16px}
legend{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#7b3fa2}
.num{width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#8b3fb0}.btn:disabled{background:#b9a6c8;color:#f3ecf8;cursor:not-allowed}
.btn2{background:#fff;color:var(--purple);border:2px solid #dccbe8}.btn2:hover{background:#f7effc}
.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #eee6f4;border-radius:10px;padding:10px 12px;background:#fcfafe;font-size:13.5px}
.item span{color:var(--mut);font-size:12px;white-space:nowrap}
.top{position:sticky;top:0;z-index:9;background:#16222f;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.tmr{font:700 15px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:8px}.tmr.warn{background:#b3261e}
.bar{height:5px;background:#2b3a48;position:sticky;top:44px;z-index:8}.bar i{display:block;height:5px;background:linear-gradient(90deg,#a06bd8,#7b1fa2)}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 110px}
.qbox{background:#fff;border:1px solid #ebe3f3;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(60,30,80,.07)}
.qteks{font-size:16.5px;font-weight:700;line-height:1.5;margin:0 0 14px;overflow-wrap:anywhere}
.qimg{display:block;max-width:100%;height:auto;max-height:300px;margin:8px auto 14px;border-radius:10px;background:#0c1829}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;margin:8px 0;border:1.5px solid #ded6e8;border-radius:12px;background:#fff;font:inherit;cursor:pointer}
.opt .ltr{flex:0 0 26px;height:26px;border-radius:50%;background:#f3ecfd;color:#7b1fa2;display:grid;place-items:center;font-weight:800;font-size:12px}
.opt.sel{border-color:var(--purple);background:#f5ecfd;box-shadow:0 0 0 2px rgba(123,31,162,.14)}.opt.sel .ltr{background:var(--purple);color:#fff}
.opt.ok{border-color:var(--ok);background:#e9f7ee}.opt.bad{border-color:var(--bad);background:#fdeceb}
.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{flex:1}
.pal{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;overflow-x:auto;z-index:9}
.pal button{flex:0 0 34px;height:34px;border-radius:9px;border:1px solid #ded6e8;background:#fff;font:700 12px ui-monospace,monospace;color:#4b5563}
.pal button.ans{background:#e7f5ec;border-color:#8fc4a5;color:#1c7c46}.pal button.cur{outline:2px solid var(--purple);outline-offset:1px}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.rev .q{font-weight:700;margin:0 0 6px}.rev .ans{font-size:13.5px;margin:2px 0}.rev .ok{color:var(--ok)}.rev .bad{color:var(--bad)}
.rev .tip{background:#eef7f1;border-left:4px solid #2f8f5b;padding:7px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.rev .exp{font-size:13px;white-space:pre-wrap;background:#f8f9fb;border:1px solid #eceff4;border-radius:8px;padding:8px 10px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}th,td{border-bottom:1px solid #eee;padding:9px 6px;text-align:left}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:#f3ecfd;color:#7b1fa2}
.note{color:var(--mut);font-size:12.5px;margin-top:12px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.left{padding:16px}.left h1{font-size:18px;margin-top:10px}
 .left p,.left .foot{display:none}.emblem{width:46px;height:46px}.emblem svg{width:28px;height:28px}
 .right{padding:14px 12px 24px;align-items:start}.cbody{padding:18px 16px 22px}.wrap{padding:14px 10px 100px}.qbox{padding:14px}.qteks{font-size:15.5px}}
</style></head><body><div id="app"></div>
<script>
const DATA={"sesi": [{"kode": "GMST_VER", "nama": "GMST201_VER — Verbal", "menit": 10, "soal": [{"id": "l114", "teks": "6 pekerja selesai dalam 10 hari. 3 pekerja selesai dalam...", "gbr": "", "opsi": ["21", "17", "20", "19"], "kunci": 2, "bahas": "JAWABAN: 20\nBerbanding terbalik: 6×10 = 3×T → T = 20 hari.\nINGAT: Trik utama logika: gambar diagram Venn atau rantai perbandingan sebelum memilih jawaban."}, {"id": "v82", "teks": "Lawan kata (antonim) dari KONKRET adalah ...", "gbr": "", "opsi": ["Jelas", "Abstrak", "Wujud", "Nyata"], "kunci": 1, "bahas": "JAWABAN: Abstrak\nKonkret berarti nyata dan berwujud, sehingga antonimnya adalah abstrak yang berarti tidak nyata atau hanya berupa khayalan.\nINGAT: Antonim = lawan makna, pilih yang benar-benar berlawanan."}, {"id": "v87", "teks": "Manakah penulisan yang BAKU menurut KBBI?", "gbr": "", "opsi": ["resiko", "risko", "risikko", "risiko"], "kunci": 3, "bahas": "JAWABAN: risiko\nBentuk baku menurut KBBI adalah risiko, bukan resiko.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v96", "teks": "Manakah kalimat yang efektif (baku)?", "gbr": "", "opsi": ["Mereka saling bantu-membantu.", "Mereka saling tolong-menolong satu sama lain.", "Mereka saling membantu.", "Mereka membantu-membantu saling."], "kunci": 2, "bahas": "JAWABAN: Mereka saling membantu.\nKalimat efektif adalah Mereka saling membantu. Kata saling sudah bermakna berbalasan sehingga tidak perlu diikuti bentuk bantu-membantu yang juga bermakna sama.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v86", "teks": "Manakah penulisan yang BAKU menurut KBBI?", "gbr": "", "opsi": ["kwitans", "kuitansi", "kuitanzi", "kwitansi"], "kunci": 1, "bahas": "JAWABAN: kuitansi\nBentuk baku menurut KBBI adalah kuitansi, bukan kwitansi.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v54", "teks": "Antonim kata BERSATU adalah...", "gbr": "", "opsi": ["Kuat", "Pecah", "Besar", "Cepat"], "kunci": 1, "bahas": "JAWABAN: Pecah\nBersatu = bersatu. Antonim: pecah.\nINGAT: Antonim = lawan makna, pilih yang benar-benar berlawanan."}, {"id": "l48", "teks": "Jika x + y = 20 dan x - y = 4, nilai x adalah...", "gbr": "", "opsi": ["8", "10", "12", "14"], "kunci": 2, "bahas": "JAWABAN: 12\nx+y=20, x-y=4 → x=12, y=8. TRIK: tambahkan kedua persamaan.\nINGAT: Trik utama logika: gambar diagram Venn atau rantai perbandingan sebelum memilih jawaban."}, {"id": "v32", "teks": "SENJATA : TENTARA = STETOSKOP : ...", "gbr": "", "opsi": ["Obat", "Rumah Sakit", "Dokter", "Perawat"], "kunci": 2, "bahas": "JAWABAN: Dokter\nSenjata = alat kerja Tentara. Stetoskop = alat kerja Dokter. TRIK: hubungan alat → profesi.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "l12", "teks": "Semua perwira lulus akademi. Budi lulus akademi. Kesimpulan:", "gbr": "", "opsi": ["Budi bukan perwira", "Budi mungkin perwira", "Tidak bisa disimpulkan", "Budi pasti perwira"], "kunci": 2, "bahas": "JAWABAN: Tidak bisa disimpulkan\nLulus akademi = syarat perlu, bukan cukup untuk jadi perwira. Kesimpulan tidak bisa ditentukan.\nINGAT: Silogisme: 'semua A adalah B' + 'X adalah A' → X pasti B. Kalau hanya tahu X adalah B, X belum tentu A."}, {"id": "l6", "teks": "Jika 5 hari pasukan tempuh 200km, 8 hari menempuh...", "gbr": "", "opsi": ["300km", "320km", "350km", "280km"], "kunci": 1, "bahas": "JAWABAN: 320km\nPer hari=200/5=40km. 8 hari=8 × 40=320km.\nINGAT: Trik utama logika: gambar diagram Venn atau rantai perbandingan sebelum memilih jawaban."}, {"id": "v65", "teks": "JARI : TANGAN = RODA : ...", "gbr": "", "opsi": ["Mobil", "Buku", "Kursi", "Pohon"], "kunci": 0, "bahas": "JAWABAN: Mobil\nJari merupakan bagian dari tangan, sebagaimana roda merupakan bagian dari mobil. Hubungan pasangan kata bersifat bagian dan keseluruhan.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "l129", "teks": "Jika hujan maka jalan basah. Jalan tidak basah. Kesimpulan...", "gbr": "", "opsi": ["Hujan", "Jalan licin", "Tidak bisa disimpulkan", "Tidak hujan"], "kunci": 3, "bahas": "JAWABAN: Tidak hujan\nModus tollens: P→Q, ¬Q → ¬P. Jalan tidak basah berarti tidak hujan.\nINGAT: Modus tollens: jika P → Q lalu Q tidak terjadi, maka P tidak terjadi."}, {"id": "v48", "teks": "Sinonim kata STRATEGI adalah...", "gbr": "", "opsi": ["Latihan", "Taktik", "Rencana", "Senjata"], "kunci": 2, "bahas": "JAWABAN: Rencana\nStrategi = rencana besar/induk untuk mencapai tujuan jangka panjang. Taktik adalah langkah pelaksanaan jangka pendek, jadi keduanya tidak sama.\nINGAT: Sinonim = persamaan makna. Pilih kata yang paling dekat maknanya, bukan yang hanya searah."}, {"id": "l49", "teks": "Deret huruf: B, E, H, K, N. Huruf berikutnya...", "gbr": "", "opsi": ["Q", "R", "S", "P"], "kunci": 0, "bahas": "JAWABAN: Q\nSelisih: +3. B(2)+3=E(5), E+3=H(8), H+3=K(11), K+3=N(14), N+3=Q(17). Jawaban: Q.\nINGAT: Deret huruf: ubah huruf menjadi nomor (A=1 sampai Z=26), lalu cari selisihnya."}, {"id": "v73", "teks": "Kata yang bersinonim dengan kata CERMAT adalah ...", "gbr": "", "opsi": ["Teliti", "Lengah", "Ceroboh", "Sembrono"], "kunci": 0, "bahas": "JAWABAN: Teliti\nCermat berarti penuh perhatian dan hati-hati, sehingga bersinonim dengan teliti. Sembrono, lengah, dan ceroboh merupakan makna yang berlawanan.\nINGAT: Sinonim = persamaan makna. Pilih kata yang paling dekat maknanya, bukan yang hanya searah."}, {"id": "v29", "teks": "Antonim kata EKSPANSI adalah...", "gbr": "", "opsi": ["Kontraksi", "Ekspresi", "Eksekusi", "Kemajuan"], "kunci": 0, "bahas": "JAWABAN: Kontraksi\nEkspansi = perluasan, pengembangan. Antonim: kontraksi = penyusutan, pengurangan.\nINGAT: Antonim = lawan makna, pilih yang benar-benar berlawanan."}, {"id": "v39", "teks": "Antonim kata MENANG adalah...", "gbr": "", "opsi": ["Cepat", "Kuat", "Seri", "Kalah"], "kunci": 3, "bahas": "JAWABAN: Kalah\nMenang = menang. Antonim: kalah.\nINGAT: Antonim = lawan makna, pilih yang benar-benar berlawanan."}, {"id": "l11", "teks": "Deret: A, C, F, J, O. Huruf berikutnya...", "gbr": "", "opsi": ["V", "W", "T", "U"], "kunci": 3, "bahas": "JAWABAN: U\nSelisih posisi: +2,+3,+4,+5,+6. O(15)+6=U(21).\nINGAT: Deret huruf: ubah huruf menjadi nomor (A=1 sampai Z=26), lalu cari selisihnya."}, {"id": "v17", "teks": "Sinonim kata DEDIKASI adalah...", "gbr": "", "opsi": ["Pengabdian", "Ketidakpedulian", "Penghindaran", "Kemalasan"], "kunci": 0, "bahas": "JAWABAN: Pengabdian\nDedikasi = pengabdian penuh, loyalitas terhadap tugas atau tujuan.\nINGAT: Sinonim = persamaan makna. Pilih kata yang paling dekat maknanya, bukan yang hanya searah."}, {"id": "v16", "teks": "PRAJURIT : SENJATA = DOKTER : ...", "gbr": "", "opsi": ["Rumah Sakit", "Obat", "Stetoskop", "Pasien"], "kunci": 2, "bahas": "JAWABAN: Stetoskop\nSenjata adalah alat kerja utama prajurit. Stetoskop adalah alat kerja utama dokter.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "v3", "teks": "SENJATA : PRAJURIT = SKALPEL : ...", "gbr": "", "opsi": ["Perawat", "Rumah Sakit", "Obat", "Dokter"], "kunci": 3, "bahas": "JAWABAN: Dokter\nSenjata alat kerja prajurit. Skalpel alat kerja dokter.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "v78", "teks": "Kata yang bersinonim dengan kata CEKATAN adalah ...", "gbr": "", "opsi": ["Lambat", "Gesit", "Lelet", "Canggung"], "kunci": 1, "bahas": "JAWABAN: Gesit\nCekatan berarti cepat dan terampil dalam bertindak, sehingga bersinonim dengan gesit. Lambat, lelet, dan canggung merupakan lawan maknanya.\nINGAT: Sinonim = persamaan makna. Pilih kata yang paling dekat maknanya, bukan yang hanya searah."}, {"id": "v19", "teks": "INISIATIF : PASIF = DISIPLIN : ...", "gbr": "", "opsi": ["Teratur", "Tertib", "Semangat", "Ceroboh"], "kunci": 3, "bahas": "JAWABAN: Ceroboh\nInisiatif-Pasif adalah antonim. Antonim Disiplin adalah Ceroboh (tidak disiplin).\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "v92", "teks": "Kata APOTIK merupakan bentuk tidak baku. Bentuk bakunya adalah ...", "gbr": "", "opsi": ["apothek", "apoteek", "apotek", "apotik"], "kunci": 2, "bahas": "JAWABAN: apotek\nApotik merupakan bentuk tidak baku. Bentuk baku yang benar menurut KBBI adalah apotek.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "l22", "teks": "Semua siswa yang rajin lulus ujian. Budi lulus ujian. Kesimpulan yang benar:", "gbr": "", "opsi": ["Budi tidak rajin", "Tidak bisa disimpulkan", "Budi pasti rajin", "Budi mungkin rajin"], "kunci": 1, "bahas": "JAWABAN: Tidak bisa disimpulkan\nPremis 'semua yang rajin lulus ujian' tidak bisa dibalik. Banyak sebab lain orang bisa lulus (soal mudah, keberuntungan), jadi status 'rajin' Budi TIDAK dapat disimpulkan — bukan hanya 'mungkin'. Sama polanya dengan soal 'semua perwira lulus akademi' → tidak bisa disimpulkan.\nINGAT: Silogisme: 'semua A adalah B' + 'X adalah A' → X pasti B. Kalau hanya tahu X adalah B, X belum tentu A."}, {"id": "v52", "teks": "Sinonim kata KOMANDAN adalah...", "gbr": "", "opsi": ["Tentara", "Prajurit", "Pemimpin", "Bawahan"], "kunci": 2, "bahas": "JAWABAN: Pemimpin\nKomandan = pemimpin. TRIK: komandan = pemimpin = komando.\nINGAT: Sinonim = persamaan makna. Pilih kata yang paling dekat maknanya, bukan yang hanya searah."}, {"id": "v91", "teks": "Manakah penulisan yang BAKU menurut KBBI?", "gbr": "", "opsi": ["ambulaans", "ambulanze", "ambulan", "ambulans"], "kunci": 3, "bahas": "JAWABAN: ambulans\nBentuk baku menurut KBBI adalah ambulans, bukan ambulan.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "l10", "teks": "BESAR:KECIL = BERANI:...", "gbr": "", "opsi": ["Kuat", "Penakut", "Cepat", "Bijak"], "kunci": 1, "bahas": "JAWABAN: Penakut\nBesar-Kecil adalah antonim. Antonim Berani adalah Penakut.\nINGAT: Trik utama logika: gambar diagram Venn atau rantai perbandingan sebelum memilih jawaban."}, {"id": "l73", "teks": "Deret huruf: D G J M P. Huruf berikutnya...", "gbr": "", "opsi": ["P", "R", "T", "S"], "kunci": 3, "bahas": "JAWABAN: S\nSelisih posisi bertambah. Huruf berikutnya = S.\nINGAT: Deret huruf: ubah huruf menjadi nomor (A=1 sampai Z=26), lalu cari selisihnya."}, {"id": "v5", "teks": "Penulisan BAKU menurut KBBI...", "gbr": "", "opsi": ["Metode", "Nasehat", "Praktek", "Analisa"], "kunci": 0, "bahas": "JAWABAN: Metode\nBaku: Nasihat, Praktik, Analisis, Metode (sudah baku).\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v51", "teks": "Kata yang TIDAK baku adalah...", "gbr": "", "opsi": ["Jadwal", "Nasihat", "Praktik", "Analisa"], "kunci": 3, "bahas": "JAWABAN: Analisa\nBaku: Analisis (bukan Analisa). TRIK: '-is' bukan '-a'.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v15", "teks": "Kata yang TIDAK baku menurut KBBI adalah...", "gbr": "", "opsi": ["Teknik", "Metode", "Sistem", "Nasehat"], "kunci": 3, "bahas": "JAWABAN: Nasehat\nPenulisan baku: Nasihat (bukan Nasehat), Praktik (bukan Praktek), Analisis (bukan Analisa).\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v95", "teks": "Manakah kalimat yang efektif (baku)?", "gbr": "", "opsi": ["Para siswa-siswa berkumpul di lapangan.", "Para siswa-siswa-siswa berkumpul di lapangan.", "Siswa-siswa para berkumpul di lapangan.", "Para siswa berkumpul di lapangan."], "kunci": 3, "bahas": "JAWABAN: Para siswa berkumpul di lapangan.\nKalimat yang efektif adalah Para siswa berkumpul di lapangan. Bentuk para siswa-siswa bersifat mubazir karena kata para sudah menyatakan makna jamak.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "v59", "teks": "KALAH : MENANG = MUNDUR : ...", "gbr": "", "opsi": ["Kuat", "Besar", "Cepat", "Maju"], "kunci": 3, "bahas": "JAWABAN: Maju\nKalah berlawanan dengan Menang. Mundur berlawanan dengan Maju. TRIK: pasangan antonim.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "v88", "teks": "Manakah penulisan yang BAKU menurut KBBI?", "gbr": "", "opsi": ["aphotek", "apotik", "apotek", "apothek"], "kunci": 2, "bahas": "JAWABAN: apotek\nBentuk baku menurut KBBI adalah apotek, bukan apotik.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "l41", "teks": "Semua anggota tim disiplin. Beberapa yang disiplin berprestasi. Kesimpulan:", "gbr": "", "opsi": ["Tidak bisa disimpulkan", "Semua anggota berprestasi", "Beberapa anggota berprestasi", "Tidak ada yang berprestasi"], "kunci": 0, "bahas": "JAWABAN: Tidak bisa disimpulkan\nDisiplin⊂Tim, beberapa Disiplin=Prestasi. Belum tentu anggota tim yang berprestasi. Tidak bisa disimpulkan.\nINGAT: Silogisme: 'semua A adalah B' + 'X adalah A' → X pasti B. Kalau hanya tahu X adalah B, X belum tentu A."}, {"id": "v90", "teks": "Manakah penulisan yang BAKU menurut KBBI?", "gbr": "", "opsi": ["iziin", "izin", "iziyn", "ijin"], "kunci": 1, "bahas": "JAWABAN: izin\nBentuk baku menurut KBBI adalah izin, bukan ijin.\nINGAT: Bentuk baku KBBI: nasihat, praktik, analisis, risiko, apotek, atlet, izin, jadwal, kuitansi, ambulans, ekspor, fotokopi."}, {"id": "l98", "teks": "Semua perwira lulus akademi. Budi perwira. Kesimpulan yang benar...", "gbr": "", "opsi": ["Mungkin benar tapi tidak pasti", "Informasi tidak cukup", "Budi lulus akademi", "Tidak bisa disimpulkan"], "kunci": 2, "bahas": "JAWABAN: Budi lulus akademi\nSilogisme: A⊆B, X∈A → X∈B.\nINGAT: Silogisme: 'semua A adalah B' + 'X adalah A' → X pasti B. Kalau hanya tahu X adalah B, X belum tentu A."}, {"id": "v35", "teks": "TAMU : HOTEL = PASIEN : ...", "gbr": "", "opsi": ["Obat", "Dokter", "Perawat", "Rumah sakit"], "kunci": 3, "bahas": "JAWABAN: Rumah sakit\nTamu dirawat/dilayani di hotel, pasien dirawat/dilayani di rumah sakit. Hubungannya: orang yang dilayani → tempat pelayanan.\nINGAT: Analogi: tentukan dulu hubungannya (alat–profesi, bagian–keseluruhan, sinonim, antonim, sebab–akibat)."}, {"id": "l97", "teks": "Semua prajurit disiplin. Andi prajurit. Kesimpulan yang benar...", "gbr": "", "opsi": ["Informasi tidak cukup", "Tidak bisa disimpulkan", "Mungkin benar tapi tidak pasti", "Andi disiplin"], "kunci": 3, "bahas": "JAWABAN: Andi disiplin\nSilogisme: semua A=B, X=A → X=B.\nINGAT: Silogisme: 'semua A adalah B' + 'X adalah A' → X pasti B. Kalau hanya tahu X adalah B, X belum tentu A."}]}, {"kode": "GMST_NUM", "nama": "GMST201_NUM — Numerik", "menit": 10, "soal": [{"id": "n12", "teks": "144 / 12 × 3 = ...", "gbr": "", "opsi": ["54", "24", "36", "48"], "kunci": 2, "bahas": "JAWABAN: 36\n144/12=12. 12 × 3=36.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n92", "teks": "98 ÷ 7 = ...", "gbr": "", "opsi": ["9", "14", "19", "18"], "kunci": 1, "bahas": "JAWABAN: 14\n98 ÷ 7 = 14 (cek: 7 × 14 = 98).\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n165", "teks": "KPK dari 9 dan 15 adalah...", "gbr": "", "opsi": ["135", "3", "24", "45"], "kunci": 3, "bahas": "JAWABAN: 45\nFaktorisasi prima: 9 = 3^2 dan 15 = 3 × 5. KPK diambil dari SEMUA faktor dengan pangkat terbesar → KPK = 45. Cara cepat: (a × b) ÷ FPB = (9 × 15) ÷ 3 = 45.\nINGAT: FPB pakai faktor SAMA dengan pangkat terkecil; KPK pakai SEMUA faktor dengan pangkat terbesar."}, {"id": "n68", "teks": "364 + 487 - 86 = ...", "gbr": "", "opsi": ["789", "765", "770", "773"], "kunci": 1, "bahas": "JAWABAN: 765\nKerjakan berurutan: 364 + 487 = 851, lalu 851 − 86 = 765.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n140", "teks": "√144 = ...", "gbr": "", "opsi": ["10", "12", "15", "11"], "kunci": 1, "bahas": "JAWABAN: 12\n√144 = 12, karena 12 × 12 = 144.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n15", "teks": "3⁴ - 2⁵ = ...", "gbr": "", "opsi": ["50", "51", "52", "49"], "kunci": 3, "bahas": "JAWABAN: 49\n3⁴=81. 2⁵=32. 81-32=49.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n31", "teks": "234 + 567 = ...", "gbr": "", "opsi": ["811", "821", "791", "801"], "kunci": 3, "bahas": "JAWABAN: 801\nJumlahkan langsung: 234 + 567 = 801.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n9", "teks": "Rata-rata 5 angka = 20. Jumlahnya...", "gbr": "", "opsi": ["100", "105", "90", "95"], "kunci": 0, "bahas": "JAWABAN: 100\nJumlah = rata-rata x banyak = 20 × 5=100.\nINGAT: Rata-rata = jumlah data ÷ banyak data."}, {"id": "n80", "teks": "56 × 23 = ...", "gbr": "", "opsi": ["1251", "1288", "1273", "1293"], "kunci": 1, "bahas": "JAWABAN: 1288\n56 × 23 = 56 × 20 + 56 × 3 = 1120 + 168 = 1288.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n137", "teks": "10³ = ...", "gbr": "", "opsi": ["1013", "951", "943", "1000"], "kunci": 3, "bahas": "JAWABAN: 1000\n10 dipangkatkan 3 = 10³ = 10 × 10 × 10 = 1000.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n60", "teks": "100 / 4 / 5 = ...", "gbr": "", "opsi": ["10", "4", "5", "6"], "kunci": 2, "bahas": "JAWABAN: 5\n100/4=25, 25/5=5. TRIK: kerjakan dari kiri ke kanan.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n154", "teks": "4,7 + 4,7 = ...", "gbr": "", "opsi": ["9,5", "9,3", "9,4", "9,6"], "kunci": 2, "bahas": "JAWABAN: 9,4\n4,7 + 4,7 = 9,4.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n71", "teks": "569 + 235 + 594 = ...", "gbr": "", "opsi": ["1398", "1379", "1403", "1384"], "kunci": 0, "bahas": "JAWABAN: 1398\nKerjakan berurutan: 569 + 235 = 804, lalu 804 + 594 = 1398.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n76", "teks": "298 + 216 + 596 = ...", "gbr": "", "opsi": ["1133", "1110", "1085", "1128"], "kunci": 1, "bahas": "JAWABAN: 1110\nKerjakan berurutan: 298 + 216 = 514, lalu 514 + 596 = 1110.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n168", "teks": "KPK dari 12 dan 16 adalah...", "gbr": "", "opsi": ["4", "48", "28", "192"], "kunci": 1, "bahas": "JAWABAN: 48\nFaktorisasi prima: 12 = 2^2 × 3 dan 16 = 2^4. KPK diambil dari SEMUA faktor dengan pangkat terbesar → KPK = 48. Cara cepat: (a × b) ÷ FPB = (12 × 16) ÷ 4 = 48.\nINGAT: FPB pakai faktor SAMA dengan pangkat terkecil; KPK pakai SEMUA faktor dengan pangkat terbesar."}, {"id": "n156", "teks": "3,8 + 3,6 = ...", "gbr": "", "opsi": ["7,3", "7,4", "7,6", "7,5"], "kunci": 1, "bahas": "JAWABAN: 7,4\n3,8 + 3,6 = 7,4.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n131", "teks": "7² = ...", "gbr": "", "opsi": ["49", "7", "14", "343"], "kunci": 0, "bahas": "JAWABAN: 49\n7² = 7 × 7 = 49.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n143", "teks": "√841 = ...", "gbr": "", "opsi": ["29", "30", "27", "28"], "kunci": 0, "bahas": "JAWABAN: 29\n√841 = 29, karena 29 × 29 = 841.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n115", "teks": "30% dari 800 = ...", "gbr": "", "opsi": ["240", "244", "247", "223"], "kunci": 0, "bahas": "JAWABAN: 240\n30% × 800 = 30/100 × 800 = 240.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "n121", "teks": "21% dari 800 = ...", "gbr": "", "opsi": ["166", "175", "153", "168"], "kunci": 3, "bahas": "JAWABAN: 168\n21% × 800 = 21/100 × 800 = 168.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "n167", "teks": "KPK dari 10 dan 15 adalah...", "gbr": "", "opsi": ["30", "5", "25", "150"], "kunci": 0, "bahas": "JAWABAN: 30\nFaktorisasi prima: 10 = 2 × 5 dan 15 = 3 × 5. KPK diambil dari SEMUA faktor dengan pangkat terbesar → KPK = 30. Cara cepat: (a × b) ÷ FPB = (10 × 15) ÷ 5 = 30.\nINGAT: FPB pakai faktor SAMA dengan pangkat terkecil; KPK pakai SEMUA faktor dengan pangkat terbesar."}, {"id": "n129", "teks": "5³ = ...", "gbr": "", "opsi": ["625", "15", "25", "125"], "kunci": 3, "bahas": "JAWABAN: 125\n5³ = 5 × 5 × 5 = 125.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n81", "teks": "47 × 84 = ...", "gbr": "", "opsi": ["3932", "3905", "3998", "3948"], "kunci": 3, "bahas": "JAWABAN: 3948\n47 × 84 = 47 × 80 + 47 × 4 = 3760 + 188 = 3948.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n21", "teks": "45 × 11 = ...", "gbr": "", "opsi": ["495", "515", "455", "475"], "kunci": 0, "bahas": "JAWABAN: 495\n45 × 11 = 45 × 10 + 45 × 1 = 450 + 45 = 495.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n85", "teks": "92 × 93 = ...", "gbr": "", "opsi": ["8592", "8534", "8555", "8556"], "kunci": 3, "bahas": "JAWABAN: 8556\n92 × 93 = 92 × 90 + 92 × 3 = 8280 + 276 = 8556.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n94", "teks": "400 ÷ 16 = ...", "gbr": "", "opsi": ["24", "29", "25", "28"], "kunci": 2, "bahas": "JAWABAN: 25\n400 ÷ 16 = 25 (cek: 16 × 25 = 400).\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n49", "teks": "√196 = ...", "gbr": "", "opsi": ["14", "15", "12", "13"], "kunci": 0, "bahas": "JAWABAN: 14\n√196 = 14, karena 14 × 14 = 196.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n74", "teks": "484 + 160 + 300 = ...", "gbr": "", "opsi": ["914", "946", "944", "915"], "kunci": 2, "bahas": "JAWABAN: 944\nKerjakan berurutan: 484 + 160 = 644, lalu 644 + 300 = 944.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n151", "teks": "√529 = ...", "gbr": "", "opsi": ["23", "21", "24", "22"], "kunci": 0, "bahas": "JAWABAN: 23\n√529 = 23, karena 23 × 23 = 529.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n120", "teks": "35% dari 200 = ...", "gbr": "", "opsi": ["59", "70", "75", "55"], "kunci": 1, "bahas": "JAWABAN: 70\n35% × 200 = 35/100 × 200 = 70.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "n170", "teks": "FPB dari 24 dan 36 adalah...", "gbr": "", "opsi": ["24", "6", "12", "72"], "kunci": 2, "bahas": "JAWABAN: 12\nFaktor persekutuan dicari dengan faktorisasi prima: 24 = 2^3 × 3 dan 36 = 2^2 × 3^2. FPB = faktor yang SAMA dengan pangkat terkecil → FPB = 12.\nINGAT: FPB pakai faktor SAMA dengan pangkat terkecil; KPK pakai SEMUA faktor dengan pangkat terbesar."}, {"id": "n58", "teks": "30% dari 500 = ...", "gbr": "", "opsi": ["120", "150", "180", "100"], "kunci": 1, "bahas": "JAWABAN: 150\n30% × 500 = 30/100 × 500 = 150.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "n147", "teks": "√361 = ...", "gbr": "", "opsi": ["19", "22", "21", "17"], "kunci": 0, "bahas": "JAWABAN: 19\n√361 = 19, karena 19 × 19 = 361.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n130", "teks": "6² = ...", "gbr": "", "opsi": ["12", "216", "36", "6"], "kunci": 2, "bahas": "JAWABAN: 36\n6² = 6 × 6 = 36.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n83", "teks": "50 × 12 = ...", "gbr": "", "opsi": ["600", "568", "572", "636"], "kunci": 0, "bahas": "JAWABAN: 600\n50 × 12 = 50 × 10 + 50 × 2 = 500 + 100 = 600.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n180", "teks": "Jika 6 buku harganya Rp30.000, berapa harga 4 buku?", "gbr": "", "opsi": ["Rp18.000", "Rp20.000", "Rp24.000", "Rp15.000"], "kunci": 1, "bahas": "JAWABAN: Rp20.000\nHarga 1 buku = Rp30.000 ÷ 6 = Rp5.000. Harga 4 buku = 4 × Rp5.000 = Rp20.000.\nINGAT: Hitung harga satuan dulu (bagi), baru kalikan dengan jumlah yang diminta."}, {"id": "n36", "teks": "3³ - 2⁴ = ...", "gbr": "", "opsi": ["9", "10", "11", "12"], "kunci": 2, "bahas": "JAWABAN: 11\n27 - 16 = 11.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}, {"id": "n62", "teks": "338 + 350 - 138 = ...", "gbr": "", "opsi": ["573", "548", "550", "535"], "kunci": 2, "bahas": "JAWABAN: 550\nKerjakan berurutan: 338 + 350 = 688, lalu 688 − 138 = 550.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n106", "teks": "4/9 + 2/9 = ...", "gbr": "", "opsi": ["6/18", "2/4", "2/3", "3/3"], "kunci": 2, "bahas": "JAWABAN: 2/3\n4/9 + 2/9 = 6/9 = 2/3 (disederhanakan dengan dibagi 3).\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "n132", "teks": "8² = ...", "gbr": "", "opsi": ["16", "64", "8", "512"], "kunci": 1, "bahas": "JAWABAN: 64\n8² = 8 × 8 = 64.\nINGAT: Hafal kuadrat 1-25 dan pangkat kecil (2⁵=32, 2⁸=256, 2¹⁰=1024)."}]}, {"kode": "GMST_FIG", "nama": "GMST201_FIG — Figural", "menit": 12, "soal": [{"id": "tg53", "teks": "Perhatikan gambar berikut. Berapa banyak lingkaran pada gambar berikut?", "gbr": "data:image/svg+xml;base64,P 8"], "kunci": 0, "bahas": "JAWABAN: 13/15\nSamakan penyebut ke 15: 2/3 = 10/15, 1/5 = 3/15. Jumlah = 13/15 = 13/15.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "m70", "teks": "Pasukan 300 prajurit, 34% dikirim misi. Sisa prajurit...", "gbr": "", "opsi": ["202", "194", "198", "200"], "kunci": 2, "bahas": "JAWABAN: 198\nDikirim = 34% × 300 = 102. Sisa = 300 - 102 = 198.\nINGAT: Persen = per seratus. Contoh: 35% × 240 = 35/100 × 240."}, {"id": "n118", "teks": "5% dari 200 = ...", "gbr": "", "opsi": ["4", "22", "10", "21"], "kunci": 2, "bahas": "JAWABAN: 10\n5% × 200 = 5/100 × 200 = 10.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "m26", "teks": "Deret geometri: 2, 6, 18, 54. Suku ke-6 adalah...", "gbr": "", "opsi": ["324", "486", "648", "162"], "kunci": 1, "bahas": "JAWABAN: 486\nRasio = 3. U6 = 2 × 3⁵ = 2 × 243 = 486. TRIK: hitung U5=162, U6=162 × 3=486.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "m122", "teks": "Jarak 425 km ditempuh dengan kecepatan 85 km/jam. Waktu tempuh...", "gbr": "", "opsi": ["6", "4", "5", "3"], "kunci": 2, "bahas": "JAWABAN: 5\nWaktu = 425÷85 = 5 jam.\nINGAT: Rumus: Jarak = Kecepatan × Waktu; Waktu = Jarak ÷ Kecepatan."}, {"id": "n88", "teks": "551 ÷ 19 = ...", "gbr": "", "opsi": ["33", "29", "31", "27"], "kunci": 1, "bahas": "JAWABAN: 29\n551 ÷ 19 = 29 (cek: 19 × 29 = 551).\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n37", "teks": "456 - 178 = ...", "gbr": "", "opsi": ["278", "288", "298", "268"], "kunci": 0, "bahas": "JAWABAN: 278\nKurangkan langsung: 456 − 178 = 278.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n47", "teks": "15 × 15 = ...", "gbr": "", "opsi": ["235", "245", "215", "225"], "kunci": 3, "bahas": "JAWABAN: 225\n15 × 15 = 15 × 10 + 15 × 5 = 150 + 75 = 225.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "m4", "teks": "Luas persegi panjang 48 cm², panjang 8 cm. Kelilingnya...", "gbr": "", "opsi": ["40 cm", "22 cm", "28 cm", "36 cm"], "kunci": 2, "bahas": "JAWABAN: 28 cm\nLebar=48/8=6. Keliling=2(8+6)=28 cm.\nINGAT: Luas persegi panjang = panjang × lebar; Keliling = 2 × (panjang + lebar)."}, {"id": "mg2", "teks": "Deret gambar berikut mengikuti pola. Gambar ke-5 adalah...", "gbr": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyNjAnIGhlaWdodD0nODAnIHN0eWxlPSdiYWNrZ3JvdW5kOiMwYzE4MjknPjxwb2x5Z29uIHBvaW50cz0nMjUsNjUgNDUsMjUgNjUsNjUnIGZpbGw9J25vbmUnIHN0cm9rZT0nIzRhOTBkOScgc3Ryb2tlLXdpZHRoPScyJy8+PGNpcmNsZSBjeD0nMTA1JyBjeT0nNDUnIHI9JzIwJyBmaWxsPSdub25lJyBzdHJva2U9JyM0YTkwZDknIHN0cm9rZS13aWR0aD0nMicvPjxyZWN0IHg9JzE0NScgeT0nMjUnIHdpZHRoPSc0MCcgaGVpZ2h0PSc0MCcgZmlsbD0nbm9uZScgc3Ryb2tlPScjNGE5MGQ5JyBzdHJva2Utd2lkdGg9JzInLz48cG9seWdvbiBwb2ludHM9JzIyNSw2NSAyNDUsMjUgMjY1LDY1JyBmaWxsPSdub25lJyBzdHJva2U9JyM0YTkwZDknIHN0cm9rZS13aWR0aD0nMicvPjx0ZXh0IHg9JzI1JyB5PScxNScgZmlsbD0nI2FhYScgZm9udC1zaXplPScxMSc+MTwvdGV4dD48dGV4dCB4PSc5NScgeT0nMTUnIGZpbGw9JyNhYWEnIGZvbnQtc2l6ZT0nMTEnPjI8L3RleHQ+PHRleHQgeD0nMTU1JyB5PScxNScgZmlsbD0nI2FhYScgZm9udC1zaXplPScxMSc+MzwvdGV4dD48dGV4dCB4PScyMjUnIHk9JzE1JyBmaWxsPScjYWFhJyBmb250LXNpemU9JzExJz40PC90ZXh0Pjwvc3ZnPg==", "opsi": ["Segitiga", "Lingkaran", "Persegi", "Bintang"], "kunci": 1, "bahas": "JAWABAN: Lingkaran\nTRIK CEPAT: Pola berulang: Segitiga-Lingkaran-Persegi-Segitiga-Lingkaran. Gambar ke-5 adalah Lingkaran. Tips: cari panjang siklus dulu, lalu posisi = (n-1) mod siklus.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "n63", "teks": "798 + 544 - 193 = ...", "gbr": "", "opsi": ["1149", "1143", "1135", "1138"], "kunci": 0, "bahas": "JAWABAN: 1149\nKerjakan berurutan: 798 + 544 = 1342, lalu 1342 − 193 = 1149.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n32", "teks": "48 × 25 = ...", "gbr": "", "opsi": ["1400", "1100", "1200", "1300"], "kunci": 2, "bahas": "JAWABAN: 1200\n48 × 25 = 48 × 20 + 48 × 5 = 960 + 240 = 1200.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n8", "teks": "Jika x:y = 3:5 dan x+y = 80, nilai y adalah...", "gbr": "", "opsi": ["30", "40", "50", "60"], "kunci": 2, "bahas": "JAWABAN: 50\nx=3k,y=5k. 8k=80,k=10. y=50.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n97", "teks": "1/4 + 1/6 = ...", "gbr": "", "opsi": ["5/13", "2/10", "6/12", "5/12"], "kunci": 3, "bahas": "JAWABAN: 5/12\nSamakan penyebut ke 12: 1/4 = 3/12, 1/6 = 2/12. Jumlah = 5/12 = 5/12.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "n53", "teks": "500 / 20 = ...", "gbr": "", "opsi": ["25", "30", "35", "20"], "kunci": 0, "bahas": "JAWABAN: 25\n500 ÷ 20 = 25 (cek: 20 × 25 = 500).\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n109", "teks": "7/8 - 1/2 = ...", "gbr": "", "opsi": ["3/9", "4/8", "6/6", "3/8"], "kunci": 3, "bahas": "JAWABAN: 3/8\nSamakan penyebut ke 8. 7/8 = 7/8, 1/2 = 4/8. Selisih = 3/8 = 3/8.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "m115", "teks": "Kecepatan 40 km/jam selama 2 jam. Jarak yang ditempuh...", "gbr": "", "opsi": ["80", "98", "62", "82"], "kunci": 0, "bahas": "JAWABAN: 80\nJarak = 40×2 = 80 km.\nINGAT: Rumus: Jarak = Kecepatan × Waktu; Waktu = Jarak ÷ Kecepatan."}, {"id": "n85", "teks": "92 × 93 = ...", "gbr": "", "opsi": ["8592", "8534", "8555", "8556"], "kunci": 3, "bahas": "JAWABAN: 8556\n92 × 93 = 92 × 90 + 92 × 3 = 8280 + 276 = 8556.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "m112", "teks": "Deret geometri: 3, 9, 27, 81. Suku ke-5 adalah...", "gbr": "", "opsi": ["248", "243", "220", "266"], "kunci": 1, "bahas": "JAWABAN: 243\nRasio = 3. U5 = 3×3⁴ = 243.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "m37", "teks": "3² + 4² = ...", "gbr": "", "opsi": ["25", "49", "7", "12"], "kunci": 0, "bahas": "JAWABAN: 25\n9 + 16 = 25. TRIK: 3-4-5 adalah triple Pythagoras.\nINGAT: Soal hitungan: tulis langkahnya, jangan mengandalkan perkiraan."}, {"id": "n89", "teks": "374 ÷ 22 = ...", "gbr": "", "opsi": ["14", "21", "18", "17"], "kunci": 3, "bahas": "JAWABAN: 17\n374 ÷ 22 = 17 (cek: 22 × 17 = 374).\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n17", "teks": "0.75 + 1/4 + 25% = ...", "gbr": "", "opsi": ["1.25", "1.5", "1.75", "1.0"], "kunci": 0, "bahas": "JAWABAN: 1.25\n0.75 + 0.25 + 0.25 = 1.25. Konversi: 1/4=0.25, 25%=0.25. Total=0.75+0.25+0.25=1.25.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "m20", "teks": "Tabel: dari 40 prajurit, 60% lulus fisik, 75% dari yang lulus juga lulus akademik. Berapa lulus keduanya?", "gbr": "", "opsi": ["22", "16", "18", "20"], "kunci": 2, "bahas": "JAWABAN: 18\nTRIK CEPAT: Lulus fisik=60% × 40=24. Lulus keduanya=75% × 24=18. Tips: kerjakan bertahap, jangan langsung 60% × 75% × 40 tanpa bayangkan dulu.\nINGAT: Persen = per seratus. Contoh: 35% × 240 = 35/100 × 240."}, {"id": "n69", "teks": "259 + 661 - 61 = ...", "gbr": "", "opsi": ["884", "874", "855", "859"], "kunci": 3, "bahas": "JAWABAN: 859\nKerjakan berurutan: 259 + 661 = 920, lalu 920 − 61 = 859.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n120", "teks": "35% dari 200 = ...", "gbr": "", "opsi": ["59", "70", "75", "55"], "kunci": 1, "bahas": "JAWABAN: 70\n35% × 200 = 35/100 × 200 = 70.\nINGAT: Persen: bagi dengan 100 lalu kalikan. Contoh: 30% × 800 = 0,3 × 800."}, {"id": "m101", "teks": "Deret aritmetika: 7, 9, 11, 13. Suku ke-11 adalah...", "gbr": "", "opsi": ["32", "21", "33", "27"], "kunci": 3, "bahas": "JAWABAN: 27\na=7, b=2. U11 = 7+10×2 = 27.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "m159", "teks": "Volume balok 10 × 6 × 6 cm adalah...", "gbr": "", "opsi": ["360", "60", "22", "180"], "kunci": 0, "bahas": "JAWABAN: 360\nV = 10×6×6 = 360 cm³.\nINGAT: Volume kubus = r³; volume balok = panjang × lebar × tinggi."}, {"id": "n31", "teks": "234 + 567 = ...", "gbr": "", "opsi": ["811", "821", "791", "801"], "kunci": 3, "bahas": "JAWABAN: 801\nJumlahkan langsung: 234 + 567 = 801.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "m117", "teks": "Kecepatan 66 km/jam selama 5 jam. Jarak yang ditempuh...", "gbr": "", "opsi": ["341", "328", "332", "330"], "kunci": 3, "bahas": "JAWABAN: 330\nJarak = 66×5 = 330 km.\nINGAT: Rumus: Jarak = Kecepatan × Waktu; Waktu = Jarak ÷ Kecepatan."}, {"id": "n50", "teks": "3/4 dari 200 = ...", "gbr": "", "opsi": ["125", "150", "175", "100"], "kunci": 1, "bahas": "JAWABAN: 150\n3/4 × 200 = 150. TRIK: 3/4 = 75%.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "n12", "teks": "144 / 12 × 3 = ...", "gbr": "", "opsi": ["54", "24", "36", "48"], "kunci": 2, "bahas": "JAWABAN: 36\n144/12=12. 12 × 3=36.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n71", "teks": "569 + 235 + 594 = ...", "gbr": "", "opsi": ["1398", "1379", "1403", "1384"], "kunci": 0, "bahas": "JAWABAN: 1398\nKerjakan berurutan: 569 + 235 = 804, lalu 804 + 594 = 1398.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n86", "teks": "93 × 94 = ...", "gbr": "", "opsi": ["8696", "8757", "8742", "8758"], "kunci": 2, "bahas": "JAWABAN: 8742\n93 × 94 = 93 × 90 + 93 × 4 = 8370 + 372 = 8742.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "n20", "teks": "1001 × 11 = ...", "gbr": "", "opsi": ["10011", "11001", "11011", "11111"], "kunci": 2, "bahas": "JAWABAN: 11011\n1001 × 11 = 1001 × 10 + 1001 × 1 = 10010 + 1001 = 11011.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "m19", "teks": "Berapa bilangan prima antara 20 dan 30?", "gbr": "", "opsi": ["3", "4", "1", "2"], "kunci": 3, "bahas": "JAWABAN: 2\nBilangan prima 20-30: 23 dan 29. Ada 2 bilangan prima.\nINGAT: Soal hitungan: tulis langkahnya, jangan mengandalkan perkiraan."}, {"id": "n111", "teks": "4/5 - 1/10 = ...", "gbr": "", "opsi": ["7/10", "8/10", "3/5", "7/11"], "kunci": 0, "bahas": "JAWABAN: 7/10\nSamakan penyebut ke 10: 4/5 = 8/10 dan 1/10 = 1/10. Selisih = 7/10.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}, {"id": "n22", "teks": "999 + 999 = ...", "gbr": "", "opsi": ["2018", "1998", "2000", "2002"], "kunci": 1, "bahas": "JAWABAN: 1998\nJumlahkan langsung: 999 + 999 = 1998.\nINGAT: Numerik: kerjakan dari kiri ke kanan dan tulis hasil antara supaya tidak keliru."}, {"id": "m156", "teks": "Volume balok 6 × 4 × 6 cm adalah...", "gbr": "", "opsi": ["24", "144", "16", "72"], "kunci": 1, "bahas": "JAWABAN: 144\nV = 6×4×6 = 144 cm³.\nINGAT: Volume kubus = r³; volume balok = panjang × lebar × tinggi."}, {"id": "m60", "teks": "Deret: 2, 5, 11, 23, 47. Suku berikutnya...", "gbr": "", "opsi": ["103", "91", "95", "99"], "kunci": 2, "bahas": "JAWABAN: 95\nPola: x2+1. 47 × 2+1=95. Jawaban: 95.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "m49", "teks": "Luas segitiga dengan alas 12 cm dan tinggi 8 cm adalah...", "gbr": "", "opsi": ["48 cm²", "56 cm²", "96 cm²", "40 cm²"], "kunci": 0, "bahas": "JAWABAN: 48 cm²\nL = 1/2 x a x t = 1/2 × 12 × 8 = 48 cm².\nINGAT: Luas persegi panjang = panjang × lebar; Keliling = 2 × (panjang + lebar)."}, {"id": "m6", "teks": "Truk menempuh 360 km dalam 4.5 jam. Kecepatan rata-rata...", "gbr": "", "opsi": ["75 km/jam", "80 km/jam", "85 km/jam", "70 km/jam"], "kunci": 1, "bahas": "JAWABAN: 80 km/jam\nv = 360/4.5 = 80 km/jam.\nINGAT: Rumus: Jarak = Kecepatan × Waktu; Waktu = Jarak ÷ Kecepatan."}, {"id": "m46", "teks": "Sebuah lingkaran berjari-jari 7 cm. Kelilingnya (π=22/7)...", "gbr": "", "opsi": ["308 cm", "44 cm", "88 cm", "154 cm"], "kunci": 1, "bahas": "JAWABAN: 44 cm\nK = 2πr = 2 × 22/7 × 7 = 44 cm.\nINGAT: Luas persegi panjang = panjang × lebar; Keliling = 2 × (panjang + lebar)."}, {"id": "m102", "teks": "Deret aritmetika: 7, 10, 13, 16. Suku ke-10 adalah...", "gbr": "", "opsi": ["36", "37", "34", "32"], "kunci": 2, "bahas": "JAWABAN: 34\na=7, b=3. U10 = 7+9×3 = 34.\nINGAT: Deret: hitung selisih dulu (aritmetika), atau cek rasio (geometri)."}, {"id": "m93", "teks": "Jika x + y = 21 dan x - y = 11, nilai x × y adalah...", "gbr": "", "opsi": ["88", "72", "89", "80"], "kunci": 3, "bahas": "JAWABAN: 80\n2x = 32 → x = 16; 2y = 10 → y = 5. x×y = 80.\nINGAT: Soal hitungan: tulis langkahnya, jangan mengandalkan perkiraan."}, {"id": "n4", "teks": "3/8 + 5/6 = ...", "gbr": "", "opsi": ["8/14", "8/24", "29/24", "31/24"], "kunci": 2, "bahas": "JAWABAN: 29/24\nKPK 8,6=24. 3/8=9/24, 5/6=20/24. Total=29/24.\nINGAT: Pecahan: samakan penyebut dulu, baru jumlahkan atau kurangkan pembilangnya."}]}, {"kode": "KRAEPELIN", "nama": "Kraepelin / Pauli", "menit": 8, "soal": [{"id": "k37", "teks": "Berapa hasil 9 + 2? (jika hasil ≥10, tulis satuannya saja)", "gbr": "", "opsi": ["1", "2", "9", "11"], "kunci": 0, "bahas": "JAWABAN: 1\n9 + 2 = 11 → yang ditulis hanya angka satuannya: 1. Ingat: hasil 10 atau lebih selalu ditulis satuannya saja (12 → 2, 15 → 5, 18 → 8).\nINGAT: Kraepelin menilai KONSISTENSI kecepatan, bukan puncak kecepatan. Latih ritme tetap dari kolom pertama sampai terakhir."}, {"id": "k52", "teks": "Berapa hasil 6 + 5? (jika hasil ≥10, tulis satuannya saja)", "gbr": "", "opsi": ["5", "11", "1", "6"], "kunci": 2, "bahas": "JAWABAN: 1\n6 + 5 = 11 → yang ditulis hanya angka satuannya: 1. Ingat: hasil 10 at eks": "Berapa hasil: 7 + 6? (jika hasil 10 atau lebih, tulis angka satuannya saja)", "gbr": "", "opsi": ["3", "13", "7", "6"], "kunci": 0, "bahas": "JAWABAN: 3\n7 + 6 = 13 → yang ditulis hanya angka satuannya: 3. Ingat: hasil 10 atau lebih selalu ditulis satuannya saja (12 → 2, 15 → 5, 18 → 8).\nINGAT: Kraepelin menilai KONSISTENSI kecepatan, bukan puncak kecepatan. Latih ritme tetap dari kolom pertama sampai terakhir."}]}, {"kode": "KEPEMIMPINAN", "nama": "Kepemimpinan TNI", "menit": 10, "soal": [{"id": "kp5", "teks": "Kamu sangat kelelahan setelah latihan panjang, tapi ada pekerjaan mendesak yang harus diselesaikan malam ini. Sikapmu?", "gbr": "", "opsi": ["Selesaikan pekerjaan meski lelah karena tanggung jawab harus dipenuhi", "Kerjakan seadanya asal selesai", "Tidur dulu, kerjaan bisa besok", "Minta orang lain yang mengerjakan"], "kunci": 0, "bahas": "JAWABAN: Selesaikan pekerjaan meski lelah karena tanggung jawab harus dipenuhi\nETOS KERJA perwira TNI: tanggung jawab di atas kenyamanan pribadi. TRIK: soal tentang lelah = pilih opsi yang menyelesaikan tugas dengan KUALITAS. Opsi seadanya (D) buruk karena kualitas tetap harus terjaga.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp96", "teks": "Kamu terpilih sebagai anggota tim yang mengikuti kompetisi antar satuan, tetapi latihan bertabrakan dengan tugas operasi. Sikapmu?", "gbr": "", "opsi": ["Melepas tugas operasi sendiri", "Mundur dari kompetisi tanpa penjelasan", "Mengajukan penyelesaian resmi: cari pengganti atau menyesuaikan jadwal lewat atasan", "Mengikuti kompetisi tanpa memberi tahu"], "kunci": 2, "bahas": "JAWABAN: Mengajukan penyelesaian resmi: cari pengganti atau menyesuaikan jadwal lewat atasan\nPrioritas ditentukan lewat jalur komando; menyesuaikan jadwal atau mencari pengganti harus disetujui atasan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp101", "teks": "Kamu mendengar anggota baru mengeluh saat latihan bahwa peraturan terlalu keras. Sikapmu?", "gbr": "", "opsi": ["Menjelaskan dasar dan tujuan peraturan dengan sabar serta memberi contoh sikap", "Membiarkan karena akan terbiasa sendiri", "Melaporkannya sebagai pembangkang", "Memarahi dan mempermalukan"], "kunci": 0, "bahas": "JAWABAN: Menjelaskan dasar dan tujuan peraturan dengan sabar serta memberi contoh sikap\nPembinaan yang baik menjelaskan makna aturan dan memberi teladan, bukan sekadar menghukum.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp17", "teks": "Dalam rapat, ada perbedaan pendapat antara dua senior. Sikapmu?", "gbr": "", "opsi": ["Sampaikan pendapat dengan hormat dan data yang mendukung", "Ikut pendapat yang paling senior", "Ikut pendapat mayoritas", "Diam karena bukan levelmu"], "kunci": 0, "bahas": "JAWABAN: Sampaikan pendapat dengan hormat dan data yang mendukung\nBERANI BICARA dengan DATA. TRIK: soal rapat = sampaikan pendapat dengan hormat + data. Bukan diam, bukan ikut-ikutan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp30", "teks": "Dalam perjalanan dinas, kamu melihat pelanggaran lalu lintas oleh rekan kerja. Sikapmu?", "gbr": "", "opsi": ["Diam karena bukan urusanmu", "Ingatkan dengan sopan tentang pentingnya keselamatan dan aturan", "Foto dan laporkan ke atasan", "Ikuti saja karena situasi darurat"], "kunci": 1, "bahas": "JAWABAN: Ingatkan dengan sopan tentang pentingnya keselamatan dan aturan\nPEDULI KESELAMATAN. TRIK: ingatkan dengan sopan = jawaban yang paling tepat untuk soal pelanggaran ringan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp9", "teks": "Kamu gagal dalam salah satu ujian fisik seleksi. Reaksimu?", "gbr": "", "opsi": ["Evaluasi kekurangan, buat rencana latihan lebih keras, dan coba lagi", "Minta kebijaksanaan khusus dari panitia", "Menyalahkan kondisi dan faktor eksternal", "Menyerah dan merasa tidak mampu"], "kunci": 0, "bahas": "JAWABAN: Evaluasi kekurangan, buat rencana latihan lebih keras, dan coba lagi\nRESILIENSI dan GROWTH MINDSET adalah kunci. TRIK: semua soal tentang kegagalan di TNI = pilih opsi yang menunjukkan EVALUASI DIRI + RENCANA PERBAIKAN + KETEKUNAN. Tidak menyalahkan eksternal, tidak menyerah.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp69", "teks": "Ada kesempatan pelatihan bergengsi, tetapi jadwalnya bentrok dengan tugas jaga yang tidak bisa ditinggalkan. Sikapmu?", "gbr": "", "opsi": ["Mengajukan permohonan penggantian tugas secara resmi atau mengikuti pelatihan pada kesempatan berikutnya", "Menyuruh rekan menggantikan tanpa laporan", "Mengikuti pelatihan tanpa memberi tahu", "Meninggalkan tugas jaga tanpa izin"], "kunci": 0, "bahas": "JAWABAN: Mengajukan permohonan penggantian tugas secara resmi atau mengikuti pelatihan pada kesempatan berikutnya\nIkuti prosedur: ajukan penggantian atau tunda pelatihan. Tugas jaga menyangkut keselamatan satuan sehingga tidak bisa ditawar.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp53", "teks": "Saat apel pagi, kamu melihat seorang anggota tertidur di barisan belakang. Sikapmu?", "gbr": "", "opsi": ["Setelah apel, mengingatkan secara pribadi tentang kedisiplinan", "Melaporkan langsung ke komandan tanpa bicara kepadanya", "Menertawakannya bersama rekan lain", "Membiarkan karena bukan wewenangmu"], "kunci": 0, "bahas": "JAWABAN: Setelah apel, mengingatkan secara pribadi tentang kedisiplinan\nPembinaan dimulai dari langkah paling ringan: ingatkan secara pribadi. Laporan langsung tanpa pembinaan membuat masalah kecil menjadi besar.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp78", "teks": "Rekanmu menawarkan jalan pintas melanggar prosedur agar tugas cepat selesai. Sikapmu?", "gbr": "", "opsi": ["Menerima sebagian agar tidak ribut", "Menolak dan mengajak menyelesaikan dengan prosedur yang benar meski lebih lama", "Diam saja tetapi tidak ikut", "Menerima karena hasilnya sama"], "kunci": 1, "bahas": "JAWABAN: Menolak dan mengajak menyelesaikan dengan prosedur yang benar meski lebih lama\nProsedur dibuat untuk menjaga akuntabilitas. Tolak dan tawarkan solusi yang benar.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp11", "teks": "Atasan memberi tugas yang menurutmu melanggar prosedur keselamatan. Sikapmu?", "gbr": "", "opsi": ["Laksanakan tapi laporkan setelahnya", "Minta orang lain yang mengerjakan", "Laksanakan tanpa pertanyaan", "Tolak dan sampaikan keberatan secara sopan dan profesional"], "kunci": 3, "bahas": "JAWABAN: Tolak dan sampaikan keberatan secara sopan dan profesional\nKESELAMATAN di atas segalanya. TRIK: soal tentang keselamatan = selalu prioritas nomor 1. Tolak dengan sopan adalah jawaban yang benar.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp45", "teks": "Kamu tidak lulus salah satu tes kesehatan sedangkan kamu sudah berlatih keras selama ini. Sikapmu?", "gbr": "", "opsi": ["Menerima hasilnya, meminta penjelasan medis, lalu memperbaiki kondisi kesehatan dan mencoba lagi", "Menyalahkan kondisi dan menyebar kekecewaan", "Berhenti mengikuti seleksi tanpa penjelasan", "Menuntut panitia mengulang tes"], "kunci": 0, "bahas": "JAWABAN: Menerima hasilnya, meminta penjelasan medis, lalu memperbaiki kondisi kesehatan dan mencoba lagi\nPerwira dituntut menerima keputusan dengan lapang, mencari tahu penyebab secara resmi, lalu berbenah. Menuntut dan menyalahkan pihak lain tidak menyelesaikan masalah.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp111", "teks": "Ada anggota yang datang terlambat karena alasan keluarga yang wajar. Sikapmu sebagai anggota satu tim?", "gbr": "", "opsi": ["Membiarkannya menanggung sendiri seluruh pekerjaan", "Memaklumi sepenuhnya tanpa melapor", "Menegurnya keras di depan tim", "Membantu dia menyesuaikan pekerjaan yang tertinggal, sambil tetap menghormati aturan satuan"], "kunci": 3, "bahas": "JAWABAN: Membantu dia menyesuaikan pekerjaan yang tertinggal, sambil tetap menghormati aturan satuan\nKebijaksanaan dan ketertiban bisa berjalan bersama: bantu secara praktis, dan biarkan atasan yang menilai kedisiplinan sesuai aturan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp8", "teks": "Kamu ditugaskan memimpin kelompok yang anggotanya lebih senior dan berpengalaman dari kamu. Sikapmu?", "gbr": "", "opsi": ["Paksakan otoritas sebagai pemimpin formal", "Serahkan semua keputusan ke anggota yang lebih senior", "Gunakan pengalaman mereka sebagai masukan tapi tetap ambil keputusan dengan percaya diri", "Minta diganti pemimpin yang lebih senior"], "kunci": 2, "bahas": "JAWABAN: Gunakan pengalaman mereka sebagai masukan tapi tetap ambil keputusan dengan percaya diri\nKEPEMIMPINAN ADAPTIF: pemimpin yang baik menggunakan kekuatan tim. TRIK: soal memimpin senior = pilih yang KOLABORATIF tapi tetap DECISIF. Ini mencerminkan kematangan kepemimpinan yang dinilai tinggi di seleksi perwira.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp51", "teks": "Atasan memberikan tugas tambahan yang menyita waktu istirahatmu secara terus-menerus tanpa penjelasan. Sikapmu?", "gbr": "", "opsi": ["Mengerjakan dengan setengah hati", "Meminta alasan kepada rekan, bukan atasan", "Menolak semua tugas tambahan", "Melaksanakan sambil menanyakan prioritas dan durasi tugas secara sopan"], "kunci": 3, "bahas": "JAWABAN: Melaksanakan sambil menanyakan prioritas dan durasi tugas secara sopan\nLaksanakan dulu, lalu klarifikasi prioritas dan jangka waktunya secara profesional. Komunikasi membuka jalan, penolakan dan bekerja setengah hati merusak kepercayaan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp12", "teks": "Kamu menemukan rekan satu tim sedang tidur saat tugas jaga malam. Sikapmu?", "gbr": "", "opsi": ["Diam saja", "Biarkan karena mungkin lelah", "Bangunkan dan ingatkan pentingnya tugas jaga", "Foto dan laporkan ke atasan"], "kunci": 2, "bahas": "JAWABAN: Bangunkan dan ingatkan pentingnya tugas jaga\nTUGAS JAGA adalah tanggung jawab kolektif. TRIK: bangunkan dulu, ingatkan pentingnya tugas. Jangan langsung lapor tanpa bicara dulu.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp59", "teks": "Kamu mengalami cedera otot menjelang ujian fisik yang menentukan. Sikapmu?", "gbr": "", "opsi": ["Menyembunyikan cedera agar tidak dianggap lemah", "Minta bantuan anggota lain menggantikan posisimu", "Tetap nekat ikut ujian tanpa laporan", "Melapor ke pembina, meminta arahan resmi, dan menjalani pengobatan serta latihan pemulihan"], "kunci": 3, "bahas": "JAWABAN: Melapor ke pembina, meminta arahan resmi, dan menjalani pengobatan serta latihan pemulihan\nMelaporkan kondisi medis adalah bentuk tanggung jawab, bukan kelemahan. Nekat justru berisiko cedera permanen.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp88", "teks": "Kamu melihat potensi bahaya pada prosedur latihan yang sedang dijalankan, tetapi waktu sudah melewati rencana. Sikapmu?", "gbr": "", "opsi": ["Mencatat saja untuk laporan setelah latihan", "Meminta anggota lain yang lebih berani melapor", "Mengingatkan dan menghentikan latihan untuk waktu tertentu sampai bahaya dikendalikan", "Melanjutkan karena mengejar target"], "kunci": 2, "bahas": "JAWABAN: Mengingatkan dan menghentikan latihan untuk waktu tertentu sampai bahaya dikendalikan\nKeselamatan lebih tinggi daripada target waktu. Hentikan, kendalikan bahaya, baru lanjutkan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp15", "teks": "Rekan kamu sering terlambat dan ini mempengaruhi kinerja tim. Sikapmu?", "gbr": "", "opsi": ["Laporkan ke atasan langsung", "Olok-olok dia di depan tim", "Biarkan karena bukan urusanmu", "Bicara secara pribadi dengan sopan, tanyakan masalahnya"], "kunci": 3, "bahas": "JAWABAN: Bicara secara pribadi dengan sopan, tanyakan masalahnya\nKOMUNIKASI PRIBADI sebelum eskalasi. TRIK: bicara pribadi dulu = jawaban yang paling tepat untuk konflik interpersonal.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp33", "teks": "Seorang bawahan menyampaikan kritik yang membangun terhadap cara Anda memimpin. Sikap yang mencerminkan jiwa kepemimpinan yang baik adalah...", "gbr": "", "opsi": ["Menerima kritik dengan lapang, mengevaluasi diri, dan berterima kasih atas masukannya", "Bersikap acuh tak acuh terhadap kritik itu", "Menolak kritik karena bawahan tidak berhak mengkritik atasan", "Menegur bawahan tersebut agar tidak mengulangi"], "kunci": 0, "bahas": "JAWABAN: Menerima kritik dengan lapang, mengevaluasi diri, dan berterima kasih atas masukannya\nPemimpin yang dewasa terbuka terhadap kritik yang membangun dan menjadikannya sarana memperbaiki diri. Sikap ini menumbuhkan kepercayaan dan rasa hormat bawahan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp25", "teks": "Kamu diberi tanggung jawab besar tapi merasa belum siap. Sikapmu?", "gbr": "", "opsi": ["Terima sebagai tantangan, kerjakan maksimal, dan belajar dari proses", "Kerjakan tapi dengan banyak alasan", "Minta tanggung jawab yang lebih kecil", "Tolak karena tidak siap"], "kunci": 0, "bahas": "JAWABAN: Terima sebagai tantangan, kerjakan maksimal, dan belajar dari proses\nTANTANGAN adalah kesempatan berkembang. TRIK: terima + kerjakan maksimal = jawaban yang selalu benar untuk soal tanggung jawab baru.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}]}, {"kode": "DASS", "nama": "DASS", "menit": 8, "soal": [{"id": "kp22", "teks": "Dalam tugas kelompok, ada anggota yang tidak berkontribusi. Sikapmu?", "gbr": "", "opsi": ["Kerjakan semuanya sendiri", "Bicara dengan anggota tersebut, tanyakan hambatannya, dan bagi ulang tugas secara adil", "Laporkan ke atasan", "Biarkan dan kurangi nilai kelompok"], "kunci": 1, "bahas": "JAWABAN: Bicara dengan anggota tersebut, tanyakan hambatannya, dan bagi ulang tugas secara adil\nKOMUNIKASI dan KEADILAN dalam tim. TRIK: tanyakan hambatan + bagi ulang tugas = jawaban yang paling tepat.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp29", "teks": "Atasan meminta kamu memilih antara dua tugas yang sama pentingnya. Sikapmu?", "gbr": "", "opsi": ["Minta waktu untuk evaluasi mana yang lebih urgent dan dampaknya lebih besar", "Pilih secara acak", "Minta orang lain yang memutuskan", "Pilih yang paling mudah"], "kunci": 0, "bahas": "JAWABAN: Minta waktu untuk evaluasi mana yang lebih urgent dan dampaknya lebih besar\nPRIORITAS berdasarkan URGENSI dan DAMPAK. TRIK: evaluasi urgent + dampak = jawaban yang paling tepat.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp106", "teks": "Kamu ditawari pindah bagian yang lebih nyaman tetapi belum ada pengganti di bagianmu saat ini. Sikapmu?", "gbr": "", "opsi": ["Menolak mentah-mentah", "Berterima kasih, menanyakan waktu yang tepat kepada atasan agar tidak mengganggu tugas", "Langsung pindah tanpa memberitahu", "Menerima sambil meninggalkan pekerjaan lama"], "kunci": 1, "bahas": "JAWABAN: Berterima kasih, menanyakan waktu yang tepat kepada atasan agar tidak mengganggu tugas\nSikap profesional: sampaikan terima kasih, tanyakan waktu yang tepat, dan pastikan tugas lama tidak terbengkalai.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp103", "teks": "Dalam latihan, kamu mengetahui satu anggota tidak mampu memenuhi standar fisik namun tetap dipaksakan. Sikapmu?", "gbr": "", "opsi": ["Menutupi agar tim terlihat baik", "Memaksanya melanjutkan karena malu melaporkan", "Membiarkan sampai terjadi cedera", "Melaporkan keadaan sebenarnya agar ada penanganan dan program latihan yang sesuai"], "kunci": 3, "bahas": "JAWABAN: Melaporkan keadaan sebenarnya agar ada penanganan dan program latihan yang sesuai\nMelaporkan keadaan adalah bentuk menjaga anggota dan satuan; menutupi justru berisiko cedera dan kegagalan tugas.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp7", "teks": "Saat briefing, atasan memberikan informasi yang menurutmu kurang akurat. Apa yang kamu lakukan?", "gbr": "", "opsi": ["Cerita ke rekan-rekan saja", "Diam saja agar tidak malu-maluin atasan", "Langsung sela dan koreksi di depan semua orang", "Catat poin tersebut lalu setelah briefing sampaikan secara pribadi dan sopan"], "kunci": 3, "bahas": "JAWABAN: Catat poin tersebut lalu setelah briefing sampaikan secara pribadi dan sopan\nKOMUNIKASI PROFESIONAL: koreksi atasan boleh tapi PRIBADI dan SOPAN. TRIK: di TNI menghormati hierarki penting, tapi diam pada kesalahan faktual juga berbahaya. C = sopan + efektif.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp23", "teks": "Kamu ditugaskan untuk pekerjaan yang tidak sesuai keahlianmu. Sikapmu?", "gbr": "", "opsi": ["Kerjakan asal-asalan", "Minta digantikan orang lain", "Tolak karena tidak ahli", "Kerjakan sambil belajar dari rekan yang lebih ahli"], "kunci": 3, "bahas": "JAWABAN: Kerjakan sambil belajar dari rekan yang lebih ahli\nMAU BELAJAR adalah kunci berkembang. TRIK: kerjakan + belajar = jawaban yang selalu benar untuk soal tugas baru.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp34", "teks": "Anda bersaing dengan teman seangkatan untuk memperoleh kenaikan pangkat. Sikap yang tepat adalah...", "gbr": "", "opsi": ["Menghindari persaingan dengan mengundurkan diri", "Berusaha menampilkan kinerja terbaik secara sportif dan menghormati pesaing", "Menjelekkan saingan Anda agar unggul", "Mencari kelemahan saingan untuk dijadikan senjata"], "kunci": 1, "bahas": "JAWABAN: Berusaha menampilkan kinerja terbaik secara sportif dan menghormati pesaing\nPersaingan sehat diwujudkan dengan prestasi nyata dan menghormati pesaing. Cara yang tidak sportif mencederai jiwa korsa dan merugikan diri sendiri.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp31", "teks": "Anda mendapati rekan kerja Anda menandatangani dokumen dinas yang tidak sesuai fakta untuk mempercepat proses. Sikap yang paling tepat Anda lakukan adalah...", "gbr": "", "opsi": ["Membiarkannya karena hal itu bukan urusan Anda", "Ikut menandatangani agar tidak dianggap rewel", "Menyebarkan informasi tersebut kepada rekan lain", "Mengingatkan rekan tersebut dan melaporkan penyimpangan kepada atasan secara bertanggung jawab"], "kunci": 3, "bahas": "JAWABAN: Mengingatkan rekan tersebut dan melaporkan penyimpangan kepada atasan secara bertanggung jawab\nIntegritas menuntut keberanian menegur dan melaporkan penyimpangan melalui jalur yang benar. Tindakan ini mencegah kerugian lebih besar bagi kedinasan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp35", "teks": "Anda menerima dua perintah dari dua atasan yang saling bertentangan dan keduanya meminta segera dilaksanakan. Tindakan yang paling tepat adalah...", "gbr": "", "opsi": ["Melaksanakan perintah yang menurut Anda lebih mudah", "Menolak kedua perintah tersebut", "Menunda keduanya tanpa penjelasan", "Melaporkan perbedaan perintah tersebut kepada atasan terkait untuk mendapat kejelasan dan arahan"], "kunci": 3, "bahas": "JAWABAN: Melaporkan perbedaan perintah tersebut kepada atasan terkait untuk mendapat kejelasan dan arahan\nPerintah yang bertentangan harus diklarifikasi melalui jalur komando agar tidak terjadi kesalahan. Melaporkan dan meminta arahan adalah wujud tanggung jawab dan disiplin.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp66", "teks": "Anggota tim meminta bantuanmu menyelesaikan pekerjaan pribadinya saat jam tugas. Sikapmu?", "gbr": "", "opsi": ["Langsung mengerjakan karena tidak ingin mengecewakan", "Menjelaskan bahwa jam tugas milik organisasi dan menawarkan bantuan setelah tugas selesai", "Menolak dengan kasar", "Menyuruh anggota lain mengerjakannya"], "kunci": 1, "bahas": "JAWABAN: Menjelaskan bahwa jam tugas milik organisasi dan menawarkan bantuan setelah tugas selesai\nPrioritas tugas organisasi di atas urusan pribadi, tetapi bantuan tetap bisa diberikan di luar jam tugas dengan cara yang menghargai orang lain.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp38", "teks": "Di lapangan terjadi kecelakaan dan ada korban terluka. Tindakan yang paling tepat adalah...", "gbr": "", "opsi": ["Meninggalkan lokasi agar tidak terlibat", "Segera memberikan pertolongan pertama dan mengoordinasikan evakuasi serta pelaporan", "Meneruskan tugas karena kecelakaan bukan tanggung jawab Anda", "Merekam kejadian untuk dibagikan"], "kunci": 1, "bahas": "JAWABAN: Segera memberikan pertolongan pertama dan mengoordinasikan evakuasi serta pelaporan\nMenolong korban adalah wujud tanggung jawab dan jiwa korsa. Pertolongan cepat dan terkoordinasi dapat menyelamatkan nyawa.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp76", "teks": "Ada anggota yang berbuat tidak adil terhadap anggota baru (perpeloncoan ringan). Sikapmu?", "gbr": "", "opsi": ["Membiarkan karena bagian tradisi", "Ikut agar tidak dianggap lemah", "Menghentikan, mengingatkan, dan melaporkan karena bertentangan dengan aturan dan etika", "Melaporkan tanpa menghentikan kejadian itu"], "kunci": 2, "bahas": "JAWABAN: Menghentikan, mengingatkan, dan melaporkan karena bertentangan dengan aturan dan etika\nPerpeloncoan dilarang. Prioritas: hentikan kejadian, ingatkan pelakunya, lalu laporkan agar ada pembinaan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp58", "teks": "Kamu menemukan dokumen dinas tertinggal di tempat umum. Tindakanmu?", "gbr": "", "opsi": ["Mengabadikan lalu mengunggahnya ke media sosial", "Mengamankan dokumen, mencatat penemuan, dan menyerahkan ke satuan sesuai prosedur", "Membacanya lebih dulu untuk tahu isinya", "Menyerahkan kepada siapa pun yang mengaku pemiliknya"], "kunci": 1, "bahas": "JAWABAN: Mengamankan dokumen, mencatat penemuan, dan menyerahkan ke satuan sesuai prosedur\nDokumen dinas harus dijaga kerahasiaannya dan dikembalikan lewat jalur resmi dengan catatan serah terima.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp24", "teks": "Atasan salah menyebutkan nama kamu di depan banyak orang. Sikapmu?", "gbr": "", "opsi": ["Marah dan tunjukkan ketidaksukaan", "Diam karena tidak sopan mengoreksi", "Koreksi dengan sopan setelah acara selesai", "Koreksi langsung di tempat"], "kunci": 2, "bahas": "JAWABAN: Koreksi dengan sopan setelah acara selesai\nSOPAN dan PROFESIONAL. TRIK: koreksi atasan = selalu setelah acara, secara pribadi.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp39", "teks": "Anda dikejar tenggat waktu namun hasil kerja harus akurat. Sikap yang paling tepat adalah...", "gbr": "", "opsi": ["Mengerjakan secepat mungkin tanpa memeriksa kembali hasilnya", "Meminta tenggat waktu diperpanjang tanpa alasan jelas", "Mengurangi kualitas agar cepat selesai", "Tetap teliti dan cermat dalam bekerja sambil mengelola waktu secara efisien agar hasil tepat dan selesai tepat waktu"], "kunci": 3, "bahas": "JAWABAN: Tetap teliti dan cermat dalam bekerja sambil mengelola waktu secara efisien agar hasil tepat dan selesai tepat waktu\nKetelitian dan ketepatan waktu harus dijalankan secara seimbang. Hasil yang akurat dan tepat waktu mencerminkan tanggung jawab dan disiplin.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp102", "teks": "Kamu harus menyampaikan kabar sulit (misalnya penugasan ke daerah terpencil) kepada keluarga. Sikapmu?", "gbr": "", "opsi": ["Menyembunyikannya sampai hari keberangkatan", "Menyampaikan dengan terus terang, menjelaskan tugas negara, dan menyiapkan hal praktis keluarga", "Berharap penugasan dibatalkan", "Meminta atasan yang memberitahu saja"], "kunci": 1, "bahas": "JAWABAN: Menyampaikan dengan terus terang, menjelaskan tugas negara, dan menyiapkan hal praktis keluarga\nKeterbukaan disertai kesiapan praktis adalah cara paling bertanggung jawab menghadapi penugasan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp105", "teks": "Saat piket malam kamu merasa sangat mengantuk. Sikapmu?", "gbr": "", "opsi": ["Mencari cara tetap terjaga (jadwal kecil, air minum, gerak) dan menjalankan piket penuh", "Meminta rekan menutupi bila ada pemeriksaan", "Tidur sebentar tanpa memberi tahu rekan piket", "Meninggalkan pos piket"], "kunci": 0, "bahas": "JAWABAN: Mencari cara tetap terjaga (jadwal kecil, air minum, gerak) dan menjalankan piket penuh\nPiket menyangkut keamanan satuan; tidur tanpa kesepakatan berisiko serius. Jaga kondisi dengan cara yang benar.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp13", "teks": "Dalam latihan, kamu melihat rekan mengalami kesulitan fisik. Sikapmu?", "gbr": "", "opsi": ["Bantu rekan tersebut meski kamu bisa tertinggal", "Teriak menyemangati dari jauh", "Laporkan ke instruktur", "Lanjutkan sendiri karena itu kompetisi"], "kunci": 0, "bahas": "JAWABAN: Bantu rekan tersebut meski kamu bisa tertinggal\nKEBERSAMAAN adalah nilai inti TNI. TRIK: bantu rekan = selalu jawaban benar dalam soal kebersamaan tim.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp3", "teks": "Kamu diberi tugas yang menurutmu tidak efisien, tapi atasan sudah memutuskan. Sikapmu?", "gbr": "", "opsi": ["Kerjakan tapi dengan setengah hati", "Tolak karena merasa lebih tahu", "Laksanakan tanpa komentar apapun", "Laksanakan tugas sambil cari waktu tepat untuk sampaikan saran perbaikan secara profesional"], "kunci": 3, "bahas": "JAWABAN: Laksanakan tugas sambil cari waktu tepat untuk sampaikan saran perbaikan secara profesional\nPRINSIP TNI: DISIPLIN + INISIATIF. TRIK: pilihan yang menggabungkan PATUH + PROAKTIF hampir selalu benar di soal kepribadian TNI.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp112", "teks": "Kamu ditunjuk sebagai pencatat kegiatan tim, tetapi ada bagian kegiatan yang tidak kamu ikuti. Sikapmu?", "gbr": "", "opsi": ["Mengosongkan bagian itu tanpa keterangan", "Mengisi seadanya", "Mengumpulkan informasi dari yang terlibat dan menandai bagian yang perlu diverifikasi", "Membuat catatan dari perkiraan sendiri"], "kunci": 2, "bahas": "JAWABAN: Mengumpulkan informasi dari yang terlibat dan menandai bagian yang perlu diverifikasi\nMenandai bagian yang belum terverifikasi jauh lebih baik daripada mengisi dengan perkiraan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}]}, {"kode": "RES", "nama": "RES — Resiliensi", "menit": 8, "soal": [{"id": "kp16", "teks": "Atasan meminta kamu memalsukan data laporan kinerja agar terlihat baik. Sikapmu?", "gbr": "", "opsi": ["Laporkan ke atasannya", "Ikuti karena itu perintah", "Tolak dengan tegas, sampaikan risiko dan konsekuensinya", "Buat data yang tidak terlalu bohong"], "kunci": 2, "bahas": "JAWABAN: Tolak dengan tegas, sampaikan risiko dan konsekuensinya\nINTEGRITAS tidak bisa ditawar. TRIK: pemalsuan = selalu tolak, tidak ada kompromi.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp87", "teks": "Rekan satu tim selalu mengambil pujian atas kerja kelompok. Sikapmu?", "gbr": "", "opsi": ["Membalas dengan cara yang sama", "Diam dan menahan kontribusi berikutnya", "Melaporkannya sebagai pelanggaran berat", "Membicarakannya secara pribadi dan meminta tim menuliskan kontribusi secara terbuka"], "kunci": 3, "bahas": "JAWABAN: Membicarakannya secara pribadi dan meminta tim menuliskan kontribusi secara terbuka\nSelesaikan dengan komunikasi langsung dan pencatatan kontribusi yang transparan — bukan dengan perilaku serupa atau diam-diam menahan kontribusi.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp107", "teks": "Kamu melihat anggota baru memotret area satuan yang seharusnya tidak boleh difoto. Sikapmu?", "gbr": "", "opsi": ["Ikut memotret saja untuk kenang-kenangan", "Diam karena tidak yakin aturannya", "Menunggu sampai ada kejadian besar", "Mengingatkan langsung, memastikan foto dihapus, dan melaporkan ke atasan"], "kunci": 3, "bahas": "JAWABAN: Mengingatkan langsung, memastikan foto dihapus, dan melaporkan ke atasan\nKeamanan informasi satuan bersifat wajib; tegur langsung, amankan, dan laporkan.\nINGAT: Soal kepribadian TNI: pilih opsi yang PROAKTIF, SOPAN, JUJUR, dan lewat prosedur resmi."}, {"id": "kp86", "teks": "Kamu menerima informasi rahasia satuan melalui percakapan yang tidak sengaja kamu dengar. Sikapmu?", "gbr": "", "opsi": ["Menyimpannya untuk keperluan pribadi", "Menjaga kerahasiaannya dan tidak membahasnya dengan siapa pun", "Membahasnya dengan rekan dekat untuk cek kebenaran", "Men
