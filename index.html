function genAritmetika(){
  const t=pick(['tambah','kurang','kali','bagi','persen','balik','deret','fpbkpk','harga','waktu','rata']);
  let teks,val,bahas,tip;
  if(t==='tambah'){const a=120+rnd(780),b=110+rnd(690);teks=`${a} + ${b} = ...`;val=a+b;bahas=`Jumlahkan langsung: ${a} + ${b} = ${val}.`;tip='Jumlahkan dari belakang (satuan dulu), simpan simpanan.'}
  else if(t==='kurang'){const a=400+rnd(560),b=90+rnd(280);teks=`${a} - ${b} = ...`;val=a-b;bahas=`${a} - ${b} = ${val}.`;tip='Kurangkan ke kelipatan 10 dulu agar mudah.'}
  else if(t==='kali'){const a=12+rnd(38),b=11+rnd(18);teks=`${a} × ${b} = ...`;val=a*b;bahas=`${a}×${b} = ${a}×${b-b%10} + ${a}×${b%10} = ${a*(b-b%10)} + ${a*(b%10)} = ${val}.`;tip='Pecah puluhan + satuan: a×b = a×(10k) + a×s.'}
  else if(t==='bagi'){const b=3+rnd(11),v=6+rnd(40),a=b*v;teks=`${a} ÷ ${b} = ...`;val=v;bahas=`${a} ÷ ${b} = ${v} (cek: ${b}×${v}=${a}).`;tip='Tutup angka belakang, cek dengan perkalian balik.'}
  else if(t==='persen'){const a=pick([80,120,160,200,240,320,400]),p=pick([5,10,15,20,25,30,40]);teks=`${p}% dari ${a} = ...`;val=a*p/100;bahas=`${p}% × ${a} = ${a}×${p}/100 = ${val}.`;tip='10% = geser koma; 25% = bagi 4; 50% = bagi 2.'}
  else if(t==='balik'){const org=pick([4,6,8,9,12]),hari=pick([6,8,10,12,15]),org2=org*2;teks=`${org} pekerja selesai dalam ${hari} hari. ${org2} pekerja selesai dalam berapa hari?`;val=(org*hari)/org2;bahas=`Orang×hari tetap: ${org}×${hari}=${org*hari}. Maka ${org2} pekerja = ${org*hari}÷${org2} = ${val} hari.`;tip='Orang × hari selalu sama (berbanding terbalik).'}
  else if(t==='deret'){const s=2+rnd(7),d=pick([2,3,4,5,6]);const arr=[s,s+d,s+2*d,s+3*d,s+4*d];teks=`Lanjutkan deret: ${arr.join(', ')}, ...`;val=s+5*d;bahas=`Selisih tetap +${d}. Maka ${arr[4]}+${d}=${val}.`;tip='Tulis selisih antar angka; kalau tetap, lanjutkan dengan pola itu.'}
  else if(t==='fpbkpk'){const a=pick([6,8,9,10,12]),b=pick([15,16,18,20,24]);const gcd=(x,y)=>y?gcd(y,x%y):x;const g=gcd(a,b);teks=`KPK dari ${a} dan ${b} adalah ...`;val=a*b/g;bahas=`FPB(${a},${b})=${g}; KPK = ${a}×${b}÷${g} = ${val}.`;tip='KPK = (a×b) ÷ FPB. FPB = pembagi terbesar.'}
  else if(t==='harga'){const a=pick([80000,120000,150000,200000]),d=pick([10,15,20,25]);teks=`Barang Rp${a.toLocaleString('id-ID')} diskon ${d}%. Harga akhir = ...`;val=a*(100-d)/100;bahas=`Bayar ${100-d}% × ${a} = ${val}.`;tip='Diskon p% → bayar (100−p)% saja, langsung kalikan.'}
  else if(t==='waktu'){const v=pick([40,50,60,80]),jam=pick([1.5,2,2.5,3]);teks=`Kecepatan ${v} km/jam selama ${jam} jam. Jarak = ... km`;val=v*jam;bahas=`Jarak = ${v} × ${jam} = ${val} km.`;tip='Jarak = kecepatan × waktu; 30 menit = 0,5 jam.'}
  else {const a=pick([60,70,80,90,100]),b=pick([70,80,90,100]),c=pick([60,80,100]);teks=`Rata-rata dari ${a}, ${b}, ${c} = ...`;val=Math.round((a+b+c)/3);bahas=`(${a}+${b}+${c}) ÷ 3 = ${val}.`;tip='Jumlahkan semua lalu bagi banyaknya data.'}
  return {teks,val,bahas,tip,tipe:'numerik'};
}
function genKraepelin(){
  // Satu butir latihan tunggal: angka di bawah dijumlahkan dengan angka tepat di atasnya.
  // Bikin pertanyaan eksplisit agar tidak mengklaim replikasi layout kolom Kraepelin resmi.
  const a=1+rnd(9), b=1+rnd(9), sum=a+b, val=sum%10;
  const teks=`Latihan hitung cepat: jumlahkan ${a} + ${b}. Jika hasilnya 10 atau lebih, tulis angka satuannya saja. Angka yang ditulis = ...`;
  const bahas=`Jumlahkan ${a}+${b}=${sum}. Yang ditulis hanya angka terakhir hasilnya, yaitu ${val}.`;
  return {teks,val,bahas,tip:'Cara cepat: jumlahkan dua angka; bila hasil dua digit, ambil digit paling kanan (contoh 8+6=14, tulis 4).',tipe:'kraepelin'};
}
function genItem(kode){
  const g = kode==='KRAEPELIN' ? genKraepelin() : genAritmetika();
  const opts=new Set([g.val]);
  while(opts.size<4){
    let d=g.val+ (rnd(2)? 1:-1)*(1+rnd(9));
    if(d<0) d=Math.abs(d)+1;
    if(d!==g.val) opts.add(d);
  }
  const opsi=shuffle([...opts]);
  return {teks:g.teks, gbr:'', opsi:opsi.map(String), kunci:opsi.indexOf(g.val),
          bahas:`JAWABAN: ${g.val}\n${g.bahas}`, tip:g.tip, topik:g.tipe};
}

/* ---------- penyusun sesi ---------- */
function buildSession(s){
  if(GEN.has(s.kode)){
    const out=[];const seen=new Set();
    let guard=0;
    while(out.length<s.soal.length && guard++<4000){
      const it=genItem(s.kode);
      if(seen.has(it.teks))continue; seen.add(it.teks); out.push(it);
    }
    return out;
  }
  // bank: acak urutan + acak posisi opsi
  return shuffle(s.soal).slice(0, s.soal.length).map(q=>{
    const idx=q.opsi.map((_,i)=>i);
    const sh=shuffle(idx);
    const opsi=sh.map(i=>q.opsi[i]);
    return {teks:q.teks, gbr:q.gbr, opsi, kunci:sh.indexOf(q.kunci), bahas:q.bahas,
            tip:TIPS[(q.topik||'')]||'Baca dua kali, buang yang mustahil, pilih yang paling masuk akal.', topik:q.topik||''};
  });
}

function left(){return `<div class="left"><div class="emblem"><svg viewBox="0 0 48 48">
<path d="M24 3 42 10v13c0 11-7.6 18.6-18 22C13.6 41.6 6 34 6 23V10L24 3z" fill="#c62828" stroke="#e6c552" stroke-width="2"/>
<path d="M24 12l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L24 28.6l-6.5 3.3 1.3-7.2-5.3-5.1 7.3-1L24 12z" fill="#f6d365"/></svg></div>
<h1>SIMULASI BELAJAR — PSIKOTES PAPK TNI</h1><div class="rule"></div>
<p>Tanpa kode akses, tanpa pendataan. Soal numerik dibuat acak setiap sesi, jadi tidak bisa dihafal.</p>
<p>Setiap sesi berakhir dengan pembahasan + cara cepat mengerjakannya.</p>
<div class="foot">© 2026 Pusat Psikologi Tentara Nasional Indonesia · simulasi belajar, bukan ujian resmi</div></div>`;}

function start(){
  const total=DATA.sesi.reduce((a,s)=>a+s.soal.length,0), menit=DATA.sesi.reduce((a,s)=>a+s.menit,0);
  app.innerHTML=`<div class="shell">${left()}<div class="right"><div class="card"><div class="cbody">
  <h2>Mulai simulasi</h2><p class="sub">${total} soal · ${DATA.sesi.length} sesi · ${menit} menit</p>
  <fieldset><legend><span class="num">1</span> SESI</legend><div class="list">
  ${DATA.sesi.map(s=>`<div class="item"><b>${esc(s.nama)}</b><span>${s.soal.length} soal · ${s.menit} mnt${GEN.has(s.kode)?' · acak':''}</span></div>`).join('')}
  </div></fieldset>
  <button class="btn" id="go">Mulai sekarang →</button>
  <p class="note">Numerik, WPT, dan Kraepelin dibuat acak tiap sesi (angka selalu baru). Sesi lain diacak urutan & posisi jawabannya.</p>
  </div></div></div></div>`;
  document.getElementById('go').onclick=()=>{S.idx=0;S.jawab={};S.hasil=[];brief();};
}

function brief(){
  const cfg=DATA.sesi[S.idx];
  const s=buildSession(cfg); S.sesi=s; S.q=0;
  app.innerHTML=`<div class="shell">${left()}<div class="right"><div class="card"><div class="cbody">
  <h2>${esc(cfg.nama)}</h2><p class="sub">Sesi ${S.idx+1} dari ${DATA.sesi.length} · ${s.length} soal · ${cfg.menit} menit</p>
  <fieldset><legend><span class="num">${S.idx+1}</span> PETUNJUK</legend>
  <p style="margin:6px 0 0;font-size:14px">Tanpa batas waktu — kerjakan santai. Setelah sesi selesai, muncul pembahasan tiap soal + cara cepatnya.</p></fieldset>
  <button class="btn" id="go">Mulai sesi ini →</button></div></div></div></div>`;
  document.getElementById('go').onclick=begin;
}

function begin(){
  q();
}
function q(){
  const cfg=DATA.sesi[S.idx],s=S.sesi,item=s[S.q];
  app.innerHTML=`<div class="top"><span><b>${esc(cfg.nama)}</b> · soal ${S.q+1}/${s.length}</span>
  <span>tanpa batas waktu</span></div>
  <div class="bar"><i style="width:${(S.q+1)/s.length*100}%"></i></div>
  <div class="wrap"><div class="qbox"><p class="qteks">${esc(item.teks)}</p>
  ${item.gbr?`<img class="qimg" src="${item.gbr}" alt="ilustrasi">`:''}
  <div id="ops">${item.opsi.map((o,i)=>`<button class="opt${S.jawab[S.q]===i?' sel':''}" data-i="${i}">
   <span class="ltr">${LTR[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="nav"><button class="btn btn2" id="prev" ${S.q===0?'disabled':''}>← Sebelumnya</button>
  <button class="btn" id="next">${S.q===s.length-1?'Selesai & lihat pembahasan':'Berikutnya →'}</button></div>
  </div></div>
  <div class="pal">${s.map((_,i)=>`<button data-q="${i}" class="${S.jawab[i]!==undefined?'ans ':''}${i===S.q?'cur':''}">${i+1}</button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.jawab[S.q]=+b.dataset.i;
    document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
    const p=document.querySelector('.pal button[data-q="'+S.q+'"]');if(p)p.classList.add('ans');});
  document.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{S.q=+b.dataset.q;q();});
  document.getElementById('prev').onclick=()=>{if(S.q>0){S.q--;q();}};
  document.getElementById('next').onclick=()=>{if(S.q<s.length-1){S.q++;q();}else finish(false);};
}

function finish(habis){
  const cfg=DATA.sesi[S.idx];clearInterval(S.timer);
  let benar=0;S.sesi.forEach((it,i)=>{if(S.jawab[i]===it.kunci)benar++;});
  S.hasil.push({nama:cfg.nama,benar,total:S.sesi.length});
  S.review={cfg,sesi:S.sesi,jawab:{...S.jawab},habis:false,benar};
  reviewView();
}

function reviewView(){
  const {cfg,sesi,jawab,habis,benar}=S.review;
  const cards=sesi.map((it,i)=>{
    const pickd=jawab[i], ok=pickd===it.kunci;
    return `<div class="rev"><p class="q">${i+1}. ${esc(it.teks)}</p>
    <p class="ans">Jawabanmu: <b class="${ok?'ok':'bad'}">${pickd===undefined?'(kosong)':esc(it.opsi[pickd])}</b>
    ${ok?'':` · Kunci: <b class="ok">${esc(it.opsi[it.kunci])}</b>`}</p>
    <div class="tip"><b>Cara cepat:</b> ${esc(it.tip||'—')}</div>
    <div class="exp">${esc(it.bahas||'')}</div></div>`;
  }).join('');
  app.innerHTML=`<div class="shell">${left()}<div class="right"><div class="card"><div class="cbody">
  <h2>Pembahasan — ${esc(cfg.nama)}</h2>
  <p class="sub">${habis?'Waktu habis. ':''}Skor <b>${benar}/${sesi.length}</b> (${Math.round(benar/sesi.length*100)}%). Baca cara cepatnya, lalu lanjut.</p>
  <div style="max-height:56vh;overflow:auto;padding-right:4px">${cards}</div>
  <button class="btn" id="go" style="margin-top:14px">${S.idx+1<DATA.sesi.length?'Lanjut sesi berikutnya →':'Lihat hasil akhir →'}</button>
  </div></div></div></div>`;
  document.getElementById('go').onclick=()=>{S.idx++;
    if(S.idx<DATA.sesi.length) brief(); else hasil();};
}

function hasil(){
  let tot=0,maks=0;
  const rows=S.hasil.map(h=>{tot+=h.benar;maks+=h.total;
    return `<tr><td>${esc(h.nama)}</td><td>${h.benar}/${h.total}</td><td>${Math.round(h.benar/h.total*100)}%</td></tr>`;}).join('');
  const pct=Math.round(tot/maks*100);
  app.innerHTML=`<div class="shell">${left()}<div class="right"><div class="card"><div class="cbody">
  <h2>Hasil simulasi</h2><p class="sub">Total <b>${tot}/${maks}</b> · nilai <span class="pill">${pct}%</span></p>
  <table><thead><tr><th>Sesi</th><th>Benar</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody></table>
  <button class="btn" id="again">Ulangi — soal numerik dibuat baru</button>
  <p class="note">Bank soal diputar ulang acak; sesi numerik/WPT/Kraepelin dibuat dari angka baru setiap kali, jadi tidak bisa dihafal.</p>
  </div></div></div></div>`;
  document.getElementById('again').onclick=()=>{S.idx=0;S.jawab={};S.hasil=[];start();};
}
start();
</script></body></html>
